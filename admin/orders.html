<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orders | Admin CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body data-page="orders">
    <div class="admin-layout"><aside class="sidebar"></aside><main class="content">
      <div class="topbar"><div><span class="section-kicker">Sales</span><h1>Orders</h1></div><button class="btn btn-outline-secondary" id="refreshOrders"><i class="bi bi-arrow-clockwise me-2"></i>Refresh</button></div>
      <div id="alertBox" class="alert d-none" role="alert"></div>
      <section class="panel"><div class="panel-header"><h2>Order List</h2></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Order</th><th>Customer</th><th>Products</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="ordersTable"></tbody></table></div></section>
    </main></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="script.js?v=3"></script>
  </body>
</html>
