<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories | Admin CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body data-page="categories">
    <div class="admin-layout"><aside class="sidebar"></aside><main class="content">
      <div class="topbar"><div><span class="section-kicker">Catalog</span><h1>Categories</h1></div><button class="btn btn-success" data-action="open-category-add"><i class="bi bi-plus-lg me-2"></i>Add Category</button></div>
      <div id="alertBox" class="alert d-none" role="alert"></div>
      <section class="panel"><div class="panel-header"><h2>All Categories</h2></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Image</th><th>Name</th><th>Status</th><th>Created</th><th class="text-end">Actions</th></tr></thead><tbody id="categoriesTable"></tbody></table></div></section>
    </main></div>
    <div id="modalMount"></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="script.js?v=3"></script>
  </body>
</html>
