<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Rrrivo Global Trade</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body class="login-body">
    <main class="login-wrap">
      <section class="login-card">
        <div class="mb-4">
          <span class="section-kicker">Admin CMS</span>
          <h1 class="h3 mt-2 mb-2">Rrrivo Global Trade</h1>
          <p class="text-muted mb-0">Sign in to manage products, orders, users, offers, banners, and store settings.</p>
        </div>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="loginForm" autocomplete="off">
          <div class="mb-3">
            <label class="form-label" for="adminEmail">Email address</label>
            <input class="form-control form-control-lg" id="adminEmail" name="email" type="email" required />
          </div>
          <div class="mb-4">
            <label class="form-label" for="adminPassword">Password</label>
            <input class="form-control form-control-lg" id="adminPassword" name="password" type="password" required />
          </div>
          <button class="btn btn-success btn-lg w-100" type="submit">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>
      </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/config.js"></script>
    <script src="script.js?v=3"></script>
  </body>
</html>
