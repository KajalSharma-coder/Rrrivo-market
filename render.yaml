services:
  - type: web
    name: rrrivo-market
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: API_URL
        sync: false
      - key: FRONTEND_URL
        value: https://rrrivo-market-2.onrender.com
      - key: CLIENT_ORIGINS
        value: https://rrrivo360.in,https://www.rrrivo360.in,https://rrrivo360.com,https://www.rrrivo360.com,https://rrrivo-market-2.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
