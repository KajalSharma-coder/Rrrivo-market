<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings | Admin CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body data-page="settings">
    <div class="admin-layout"><aside class="sidebar"></aside><main class="content">
      <div class="topbar"><div><span class="section-kicker">Store</span><h1>Settings</h1></div></div>
      <div id="alertBox" class="alert d-none" role="alert"></div>
      <section class="panel">
        <form id="settingsForm">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Store Name</label><input class="form-control" name="storeName" /></div>
            <div class="col-md-6"><label class="form-label">Contact Number</label><input class="form-control" name="contactNumber" /></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email" type="email" /></div>
            <div class="col-md-6"><label class="form-label">Facebook</label><input class="form-control" name="facebook" /></div>
            <div class="col-md-6"><label class="form-label">Instagram</label><input class="form-control" name="instagram" /></div>
            <div class="col-md-6"><label class="form-label">X</label><input class="form-control" name="x" /></div>
            <div class="col-md-6"><label class="form-label">LinkedIn</label><input class="form-control" name="linkedin" /></div>
            <div class="col-12"><label class="form-label">Address</label><textarea class="form-control" name="address" rows="2"></textarea></div>
            <div class="col-12"><label class="form-label">Footer Content</label><textarea class="form-control" name="footerContent" rows="3"></textarea></div>
            <div class="col-12"><label class="form-label">About Us Content</label><textarea class="form-control" name="aboutUsContent" rows="4"></textarea></div>
          </div>
          <div class="mt-4"><button class="btn btn-success" type="submit"><i class="bi bi-save me-2"></i>Save Settings</button></div>
        </form>
      </section>
    </main></div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="/config.js"></script>
    <script src="script.js?v=3"></script>
  </body>
</html>
