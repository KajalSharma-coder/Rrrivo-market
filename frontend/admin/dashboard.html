<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Admin CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=3" />
  </head>
  <body data-page="dashboard">
    <div class="admin-layout">
      <aside class="sidebar"></aside>
      <main class="content">
        <div class="topbar">
          <div>
            <span class="section-kicker">Overview</span>
            <h1>Dashboard</h1>
          </div>
          <button class="btn btn-outline-secondary" id="refreshDashboard"><i class="bi bi-arrow-clockwise me-2"></i>Refresh</button>
        </div>
        <div id="alertBox" class="alert d-none" role="alert"></div>
        <section class="stat-grid" id="dashboardStats"></section>
        <section class="panel">
          <div class="panel-header">
            <h2>Monthly Orders</h2>
          </div>
          <div class="table-responsive">
            <table class="table align-middle">
              <thead><tr><th>Month</th><th>Orders</th><th>Revenue</th></tr></thead>
              <tbody id="monthlyOrdersBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/config.js"></script>
    <script src="script.js?v=3"></script>
  </body>
</html>
